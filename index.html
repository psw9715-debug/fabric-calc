<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5F3EE">
<title>홈패션 연단 계산기</title>
<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --surface2: #F0EEEC;
  --border: #E0DCD6; --text: #1A1814; --text2: #6B6660; --text3: #A8A4A0;
  --accent: #2D5A3D; --accent2: #E4EDE6; --accent3: #4A7C5F;
  --danger: #B03020; --danger2: #FDECEA;
  --warn: #7A5C10; --warn2: #FDF3DC;
  --info: #1A4A7A; --info2: #E0ECFA;
  --radius: 16px; --radius-sm: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.5; overscroll-behavior-y: none; }
.screen { display: none; min-height: 100dvh; flex-direction: column; }
.screen.active { display: flex; }
.header { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 52px 16px 12px; position: sticky; top: 0; z-index: 100; }
.header-row { display: flex; align-items: center; gap: 10px; }
.back-btn { width: 40px; height: 40px; border: none; background: var(--surface2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; flex-shrink: 0; touch-action: manipulation; }
.header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.6px; }
.header p { font-size: 13px; color: var(--text2); margin-top: 2px; font-weight: 500; }
.content { flex: 1; overflow-y: auto; padding: 12px 16px 24px; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { display: none; }
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-title { font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 14px; }
.product-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.product-item-name { font-size: 18px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.4px; }
.product-item-info { font-size: 13px; color: var(--text2); line-height: 1.7; font-weight: 500; }
.product-item-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn-sm { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; border: none; cursor: pointer; touch-action: manipulation; min-height: 44px; }
.btn-edit { background: var(--surface2); color: var(--text); }
.btn-del { background: var(--danger2); color: var(--danger); }
.btn-calc { background: var(--accent); color: white; flex: 1; }
.btn-primary { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: -0.3px; transition: opacity 0.15s; min-height: 56px; touch-action: manipulation; }
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }
.btn-secondary { width: 100%; padding: 14px; background: var(--surface2); color: var(--text); border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; min-height: 52px; touch-action: manipulation; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn-primary, .btn-row .btn-secondary { flex: 1; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 8px; display: block; }
.form-input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 18px; background: var(--surface); color: var(--text); outline: none; -webkit-appearance: none; transition: border-color 0.15s; font-weight: 600; min-height: 52px; }
.form-input:focus { border-color: var(--accent); }
.input-row { display: flex; gap: 10px; }
.input-row .form-group { flex: 1; }
.tab-group { display: flex; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 14px; gap: 4px; }
.tab-btn { flex: 1; padding: 12px 4px; text-align: center; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text2); transition: all 0.2s; border: none; background: transparent; touch-action: manipulation; min-height: 44px; }
.tab-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.piece-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.piece-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.piece-badge { font-size: 13px; font-weight: 800; background: var(--accent); color: white; padding: 5px 14px; border-radius: 20px; }
.piece-del { width: 32px; height: 32px; background: var(--danger2); color: var(--danger); border: none; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
.toggle-label { font-size: 14px; font-weight: 700; }
.toggle-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.toggle { width: 50px; height: 30px; background: var(--border); border-radius: 15px; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; border: none; touch-action: manipulation; }
.toggle.on { background: var(--accent); }
.toggle-knob { width: 26px; height: 26px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.2); pointer-events: none; }
.toggle.on .toggle-knob { left: 22px; }
.grid-btns { display: grid; gap: 8px; margin-bottom: 8px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); }
.grid-btn { padding: 14px 4px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-weight: 800; background: var(--surface); color: var(--text2); cursor: pointer; text-align: center; transition: all 0.15s; touch-action: manipulation; min-height: 52px; }
.grid-btn.active { border-color: var(--accent); background: var(--accent2); color: var(--accent); }
.result-hero { text-align: center; padding: 28px 16px 22px; background: var(--accent2); border: 2px solid #B8D4C0; border-radius: var(--radius); margin-bottom: 12px; }
.result-num { font-size: 56px; font-weight: 900; color: var(--accent); letter-spacing: -3px; line-height: 1; }
.result-unit-text { font-size: 22px; font-weight: 800; color: var(--accent3); margin-top: 8px; }
.result-label { font-size: 14px; color: var(--text2); margin-top: 10px; font-weight: 600; }
.stat-row { display: flex; gap: 10px; margin-bottom: 12px; }
.stat-box { flex: 1; background: var(--surface2); border-radius: var(--radius-sm); padding: 16px 10px; text-align: center; border: 1px solid var(--border); }
.stat-val { font-size: 22px; font-weight: 900; }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; font-weight: 700; }
.plan-card { background: var(--surface); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.plan-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.plan-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.plan-name { font-size: 16px; font-weight: 800; flex: 1; }
.plan-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
.plan-tag-ok { background: var(--accent2); color: var(--accent); }
.plan-tag-warn { background: var(--warn2); color: var(--warn); }
.plan-body { font-size: 14px; line-height: 1.9; color: var(--text2); font-weight: 600; }
.plan-body strong { color: var(--text); font-weight: 800; }
.sheet-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.sheet-label { font-size: 12px; font-weight: 700; color: var(--text3); margin-bottom: 6px; }
.sheet-canvas { position: relative; background: #fff; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; width: 100%; }
.sheet-piece-row { position: absolute; left: 0; right: 0; display: flex; }
.sheet-piece-cell { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); border-right: 1px dashed rgba(255,255,255,0.3); }
.sheet-piece-cell:last-child { border-right: none; }
.sheet-margin-stripe { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(45deg,#FDF3DC,#FDF3DC 4px,#FEF9EE 4px,#FEF9EE 8px); }
.highlight-box { border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
.highlight-box.yellow { background: var(--warn2); border: 1.5px solid #E0C870; }
.highlight-box-title { font-size: 12px; font-weight: 800; color: var(--text2); margin-bottom: 6px; }
.highlight-box-val { font-size: 14px; font-weight: 700; line-height: 1.7; }
.empty { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 56px; margin-bottom: 20px; }
.empty-text { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
.empty-sub { font-size: 15px; color: var(--text2); line-height: 1.7; }
.bottom-bar { padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
.info-text { font-size: 13px; color: var(--text3); line-height: 1.7; font-weight: 500; }
.sync-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 13px; font-weight: 700; }
.sync-bar.ok { background: var(--accent2); color: var(--accent); }
.sync-bar.err { background: var(--danger2); color: var(--danger); }
.sync-bar.loading { background: var(--surface2); color: var(--text2); }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  .no-print { display: none !important; }
  .screen { display: flex !important; }
  #screen-result { display: flex !important; min-height: auto; }
  .header { position: static; padding-top: 16px; }
  .content { overflow: visible; }
  .bottom-bar { display: none !important; }
}
</style>
</head>
<body>

<!-- MAIN -->
<div id="screen-main" class="screen active">
  <div class="header no-print">
    <div class="header-row">
      <div style="flex:1">
        <h1>🏠 홈패션 연단 계산기</h1>
        <p>제품을 선택하거나 새로 등록하세요</p>
      </div>
      <button class="back-btn" onclick="syncNow()" title="동기화">↺</button>
    </div>
    <div id="sync-status"></div>
  </div>
  <div class="content">
    <div class="empty" id="empty-state">
      <div class="empty-icon">📦</div>
      <div class="empty-text">저장된 제품이 없어요</div>
      <div class="empty-sub">아래 버튼으로 제품을 등록하면<br>모든 기기에서 공유돼요</div>
    </div>
    <div id="product-list"></div>
    <div style="height:20px"></div>
  </div>
  <div class="bottom-bar no-print">
    <button class="btn-primary" onclick="goToRegister()">+ 새 제품 등록</button>
  </div>
</div>

<!-- REGISTER -->
<div id="screen-register" class="screen">
  <div class="header no-print">
    <div class="header-row">
      <button class="back-btn" onclick="showScreen('screen-main')">←</button>
      <div>
        <h1 id="reg-title">제품 등록</h1>
        <p>피스 정보를 입력하고 저장하세요</p>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-title">제품 정보</div>
      <div class="form-group">
        <label class="form-label">제품 이름</label>
        <input type="text" id="prod-name" class="form-input" placeholder="예: 쿠션커버 40cm">
      </div>
    </div>
    <div class="card">
      <div class="card-title">피스 구성 (최대 4종류)</div>
      <div id="pieces-container"></div>
      <button class="btn-secondary" id="add-piece-btn" onclick="addPiece()" style="margin-top:8px">+ 피스 추가</button>
    </div>
    <div style="height:20px"></div>
  </div>
  <div class="bottom-bar no-print">
    <button class="btn-primary" onclick="saveProduct()">저장하기</button>
  </div>
</div>

<!-- CALC -->
<div id="screen-calc" class="screen">
  <div class="header no-print">
    <div class="header-row">
      <button class="back-btn" onclick="showScreen('screen-main')">←</button>
      <div>
        <h1 id="calc-prod-name">연단 계산</h1>
        <p>원단 정보를 입력하세요</p>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-title">계산 모드</div>
      <div class="tab-group">
        <button class="tab-btn active" id="modeA-tab" onclick="setMode('A')">원단 길이 → 수량</button>
        <button class="tab-btn" id="modeB-tab" onclick="setMode('B')">목표 수량 → 길이</button>
      </div>
      <div class="info-text" id="mode-desc">원단 길이를 입력하면 최대 생산 수량을 계산합니다</div>
    </div>
    <div class="card">
      <div class="card-title">원단 정보</div>
      <div class="form-group">
        <label class="form-label">원단 폭 (cm)</label>
        <input type="number" id="fabric-width" class="form-input" placeholder="예: 157" inputmode="decimal">
      </div>
      <div id="fabric-length-group">
        <div class="form-group">
          <label class="form-label">원단 길이</label>
          <div class="tab-group">
            <button class="tab-btn active" id="unit-cm" onclick="setUnit('cm')">cm</button>
            <button class="tab-btn" id="unit-yard" onclick="setUnit('yard')">야드</button>
          </div>
          <input type="number" id="fabric-length" class="form-input" placeholder="예: 900" inputmode="decimal">
          <div class="info-text" style="margin-top:6px" id="yard-info"></div>
        </div>
      </div>
      <div id="fabric-qty-group" style="display:none">
        <div class="form-group">
          <label class="form-label">목표 수량 (세트)</label>
          <input type="number" id="target-qty" class="form-input" placeholder="예: 100" inputmode="numeric">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">재단 설정</div>
      <div class="form-group">
        <label class="form-label">커팅 가이드 줄 수</label>
        <div class="grid-btns grid-4">
          <button class="grid-btn active" id="guide-1" onclick="setGuide(1)">1줄</button>
          <button class="grid-btn" id="guide-2" onclick="setGuide(2)">2줄</button>
          <button class="grid-btn" id="guide-3" onclick="setGuide(3)">3줄</button>
          <button class="grid-btn" id="guide-4" onclick="setGuide(4)">4줄</button>
        </div>
        <div class="info-text">재단 바닥에 세팅된 커팅 가이드 줄 수</div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">위아래 여유 (cm)</label>
        <div class="grid-btns grid-5">
          <button class="grid-btn" id="margin-0" onclick="setMargin(0)">0</button>
          <button class="grid-btn active" id="margin-1" onclick="setMargin(1)">1</button>
          <button class="grid-btn" id="margin-2" onclick="setMargin(2)">2</button>
          <button class="grid-btn" id="margin-3" onclick="setMargin(3)">3</button>
          <button class="grid-btn" id="margin-5" onclick="setMargin(5)">5</button>
        </div>
        <div class="info-text" style="margin-top:6px">연단 위아래 재단 여유분</div>
      </div>
    </div>
    <div style="height:20px"></div>
  </div>
  <div class="bottom-bar no-print">
    <button class="btn-primary" onclick="calculate()">계산하기</button>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="header no-print">
    <div class="header-row">
      <button class="back-btn" onclick="showScreen('screen-calc')">←</button>
      <div>
        <h1>계산 결과</h1>
        <p id="result-subtitle"></p>
      </div>
    </div>
  </div>
  <div class="content" id="result-content"></div>
  <div class="bottom-bar no-print">
    <div class="btn-row">
      <button class="btn-secondary" onclick="showScreen('screen-calc')">다시 계산</button>
      <button class="btn-primary" onclick="window.print()">출력 / PDF</button>
    </div>
  </div>
</div>

<script>
// ==================== GitHub 설정 ====================
const GH_TOKEN  = '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';
const GH_OWNER  = 'psw9715-debug';
const GH_REPO   = 'fabric-calc';
const GH_FILE   = 'products.json';
const GH_BRANCH = 'main';
const API_BASE  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

// ==================== GitHub API ====================
async function ghGet() {
  const res = await fetch(API_BASE + '?ref=' + GH_BRANCH, {
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (res.status === 404) return { content: [], sha: null };
  if (!res.ok) throw new Error('읽기 실패 ' + res.status);
  const data = await res.json();
  const content = JSON.parse(atob(data.content.replace(/\n/g,'')));
  return { content, sha: data.sha };
}

async function ghPut(content, sha) {
  const body = { message: '제품 데이터 업데이트', content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), branch: GH_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(API_BASE, {
    method: 'PUT',
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('저장 실패 ' + res.status);
  const data = await res.json();
  return data.content.sha;
}

// ==================== State ====================
let products = [];
let fileSha = null;
let calcMode = 'A';
let lengthUnit = 'cm';
let guideLines = 1;
let marginCm = 1;
let editingIndex = -1;
let pieceCount = 0;

const COLORS = ['#2D5A3D','#B03020','#1A4A7A','#7A5C10'];
const LIGHTS = ['#E4EDE6','#FDECEA','#E0ECFA','#FDF3DC'];

// ==================== Sync ====================
function setSyncStatus(type, msg) {
  const el = document.getElementById('sync-status');
  if (!msg) { el.innerHTML = ''; return; }
  const spinner = type === 'loading' ? '<div class="spinner"></div>' : '';
  el.innerHTML = `<div class="sync-bar ${type}">${spinner}${msg}</div>`;
}

async function syncNow() {
  setSyncStatus('loading', '서버에서 불러오는 중...');
  try {
    const { content, sha } = await ghGet();
    products = content;
    fileSha = sha;
    // 로컬에도 캐시
    try { localStorage.setItem('fabric_cache', JSON.stringify({ products, sha })); } catch(e) {}
    renderProductList();
    setSyncStatus('ok', '✓ 최신 데이터 불러왔어요');
    setTimeout(() => setSyncStatus('', ''), 2500);
  } catch(e) {
    setSyncStatus('err', '⚠ 불러오기 실패 — 로컬 데이터 사용 중');
  }
}

async function saveToGitHub() {
  setSyncStatus('loading', '저장 중...');
  try {
    fileSha = await ghPut(products, fileSha);
    try { localStorage.setItem('fabric_cache', JSON.stringify({ products, sha: fileSha })); } catch(e) {}
    setSyncStatus('ok', '✓ 저장됐어요');
    setTimeout(() => setSyncStatus('', ''), 2500);
    return true;
  } catch(e) {
    setSyncStatus('err', '⚠ 저장 실패: ' + e.message);
    return false;
  }
}

function loadLocalCache() {
  try {
    const c = localStorage.getItem('fabric_cache');
    if (c) { const d = JSON.parse(c); products = d.products || []; fileSha = d.sha || null; }
  } catch(e) {}
}

// ==================== Navigation ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ==================== Product List ====================
function renderProductList() {
  const list = document.getElementById('product-list');
  const empty = document.getElementById('empty-state');
  if (!products.length) { empty.style.display = 'block'; list.innerHTML = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = products.map((p, i) => `
    <div class="product-item">
      <div class="product-item-name">${esc(p.name)}</div>
      <div class="product-item-info">${p.pieces.map(pc =>
        `${esc(pc.name)} ${pc.w}×${pc.h}cm × ${pc.qty}장 <span style="font-size:11px;background:${pc.rotatable?'var(--accent2)':'var(--warn2)'};color:${pc.rotatable?'var(--accent)':'var(--warn)'};padding:2px 6px;border-radius:8px;font-weight:700;">${pc.rotatable?'회전가능':'식서고정'}</span>`
      ).join('<br>')}</div>
      <div class="product-item-actions">
        <button class="btn-sm btn-edit" onclick="goToRegister(${i})">수정</button>
        <button class="btn-sm btn-del" onclick="deleteProduct(${i})">삭제</button>
        <button class="btn-sm btn-calc" onclick="goToCalc(${i})">계산 →</button>
      </div>
    </div>
  `).join('');
}

// ==================== Register ====================
function goToRegister(idx = -1) {
  editingIndex = idx; pieceCount = 0;
  document.getElementById('pieces-container').innerHTML = '';
  document.getElementById('reg-title').textContent = idx >= 0 ? '제품 수정' : '제품 등록';
  if (idx >= 0) {
    document.getElementById('prod-name').value = products[idx].name;
    products[idx].pieces.forEach(pc => addPiece(pc));
  } else {
    document.getElementById('prod-name').value = '';
    addPiece();
  }
  showScreen('screen-register');
}

function addPiece(data = null) {
  if (pieceCount >= 4) return;
  const i = pieceCount++;
  const labels = ['A','B','C','D'];
  const isRotatable = data ? data.rotatable : false; // 기본값: 식서고정
  const div = document.createElement('div');
  div.className = 'piece-card';
  div.id = `piece-${i}`;
  div.innerHTML = `
    <div class="piece-card-header">
      <span class="piece-badge">피스 ${labels[i]}</span>
      ${i > 0 ? `<button class="piece-del" onclick="removePiece('piece-${i}')">×</button>` : ''}
    </div>
    <div class="form-group">
      <label class="form-label">피스 이름</label>
      <input type="text" class="form-input" id="p${i}-name" placeholder="예: 앞판" value="${data ? esc(data.name) : ''}">
    </div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">가로 (cm)</label>
        <input type="number" class="form-input" id="p${i}-w" placeholder="0" inputmode="decimal" value="${data ? data.w : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">세로 (cm)</label>
        <input type="number" class="form-input" id="p${i}-h" placeholder="0" inputmode="decimal" value="${data ? data.h : ''}">
      </div>
    </div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">1세트당 수량</label>
        <input type="number" class="form-input" id="p${i}-qty" placeholder="1" inputmode="numeric" value="${data ? data.qty : '1'}">
      </div>
      <div class="form-group">
        <div class="toggle-row" style="padding-top:30px">
          <div>
            <div class="toggle-label">회전 가능</div>
            <div class="toggle-sub">식서 방향 무관</div>
          </div>
          <button type="button" class="toggle ${isRotatable ? 'on' : ''}" id="p${i}-rot" onclick="this.classList.toggle('on')">
            <div class="toggle-knob"></div>
          </button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('pieces-container').appendChild(div);
  updateAddBtn();
}

function removePiece(id) {
  const el = document.getElementById(id);
  if (el) { el.remove(); pieceCount--; updateAddBtn(); }
}

function updateAddBtn() {
  document.getElementById('add-piece-btn').style.display = pieceCount >= 4 ? 'none' : 'block';
}

function getPieceData() {
  const labels = ['A','B','C','D'];
  return Array.from({ length: 4 }, (_, i) => {
    const el = document.getElementById(`piece-${i}`);
    if (!el) return null;
    const w = parseFloat(document.getElementById(`p${i}-w`).value);
    const h = parseFloat(document.getElementById(`p${i}-h`).value);
    if (!w || !h || w <= 0 || h <= 0) return null;
    return {
      name: document.getElementById(`p${i}-name`).value.trim() || `피스 ${labels[i]}`,
      w, h,
      qty: parseInt(document.getElementById(`p${i}-qty`).value) || 1,
      rotatable: document.getElementById(`p${i}-rot`).classList.contains('on')
    };
  }).filter(Boolean);
}

async function saveProduct() {
  const name = document.getElementById('prod-name').value.trim();
  if (!name) { alert('제품 이름을 입력해주세요'); return; }
  const pieces = getPieceData();
  if (!pieces.length) { alert('피스 정보를 하나 이상 입력해주세요'); return; }
  const prod = { name, pieces };
  if (editingIndex >= 0) products[editingIndex] = prod;
  else products.push(prod);
  const ok = await saveToGitHub();
  if (ok) { renderProductList(); showScreen('screen-main'); }
}

async function deleteProduct(i) {
  if (!confirm(`"${products[i].name}"을 삭제할까요?`)) return;
  products.splice(i, 1);
  const ok = await saveToGitHub();
  if (ok) renderProductList();
}

// ==================== Calc Setup ====================
function goToCalc(i) {
  currentProduct = products[i];
  document.getElementById('calc-prod-name').textContent = currentProduct.name;
  document.getElementById('fabric-width').value = '';
  document.getElementById('fabric-length').value = '';
  document.getElementById('target-qty').value = '';
  setMode('A'); setUnit('cm'); setGuide(1); setMargin(1);
  showScreen('screen-calc');
}

let currentProduct = null;

function setMode(m) {
  calcMode = m;
  document.getElementById('modeA-tab').classList.toggle('active', m === 'A');
  document.getElementById('modeB-tab').classList.toggle('active', m === 'B');
  document.getElementById('fabric-length-group').style.display = m === 'A' ? 'block' : 'none';
  document.getElementById('fabric-qty-group').style.display = m === 'B' ? 'block' : 'none';
  document.getElementById('mode-desc').textContent = m === 'A'
    ? '원단 길이를 입력하면 최대 생산 수량을 계산합니다'
    : '목표 수량을 입력하면 필요한 원단 길이를 계산합니다';
}

function setUnit(u) {
  lengthUnit = u;
  document.getElementById('unit-cm').classList.toggle('active', u === 'cm');
  document.getElementById('unit-yard').classList.toggle('active', u === 'yard');
  document.getElementById('fabric-length').placeholder = u === 'cm' ? '예: 900' : '예: 10';
  updateYardInfo();
}

function updateYardInfo() {
  const v = parseFloat(document.getElementById('fabric-length').value);
  document.getElementById('yard-info').textContent = (lengthUnit === 'yard' && v) ? `= ${(v * 91.44).toFixed(0)}cm` : '';
}

function setGuide(n) {
  guideLines = n;
  [1,2,3,4].forEach(i => document.getElementById(`guide-${i}`).classList.toggle('active', i === n));
}

function setMargin(n) {
  marginCm = n;
  [0,1,2,3,5].forEach(i => document.getElementById(`margin-${i}`).classList.toggle('active', i === n));
}

document.addEventListener('input', e => { if (e.target.id === 'fabric-length') updateYardInfo(); });

// ==================== Core Engine ====================
function bestFit(piece, fabricW) {
  // 식서고정: 가로 그대로, 회전가능: 더 많이 들어가는 방향
  const opts = [{ w: piece.w, h: piece.h }];
  if (piece.rotatable && piece.w !== piece.h) opts.push({ w: piece.h, h: piece.w });
  let best = null;
  for (const o of opts) {
    const perRow = Math.floor(fabricW / o.w);
    if (perRow > 0 && (!best || perRow > best.perRow)) best = { perRow, pieceW: o.w, pieceH: o.h };
  }
  return best || { perRow: 0, pieceW: piece.w, pieceH: piece.h };
}

function calcPlan(piece, fabricW, targetSets, guide, margin) {
  const fit = bestFit(piece, fabricW);
  const perRow = fit.perRow;
  if (perRow === 0) return null;
  const totalPieces = targetSets * piece.qty;
  const totalRows = Math.ceil(totalPieces / perRow);
  const fullSheets = Math.floor(totalRows / guide);
  const remRows = totalRows % guide;
  const sheetLen = guide * fit.pieceH + margin * 2;
  const remSheetLen = remRows > 0 ? remRows * fit.pieceH + margin * 2 : 0;
  const totalLen = fullSheets * sheetLen + remSheetLen;
  const totalSheets = fullSheets + (remRows > 0 ? 1 : 0);
  return { perRow, pieceW: fit.pieceW, pieceH: fit.pieceH, totalPieces, totalRows, fullSheets, remRows, sheetLen, remSheetLen, totalLen, totalSheets };
}

function calcModeA(piece, fabricW, fabricLen, guide, margin) {
  let lo = 0, hi = 50000, best = 0, bestPlan = null;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (mid === 0) { lo = 1; continue; }
    const plan = calcPlan(piece, fabricW, mid, guide, margin);
    if (plan && plan.totalLen <= fabricLen + 0.001) { best = mid; bestPlan = plan; lo = mid + 1; }
    else hi = mid - 1;
  }
  return { maxSets: best, plan: bestPlan };
}

// ==================== Calculate ====================
function calculate() {
  const fabricW = parseFloat(document.getElementById('fabric-width').value);
  if (!fabricW || fabricW <= 0) { alert('원단 폭을 입력해주세요'); return; }

  let fabricLen = null, targetQty = null;
  if (calcMode === 'A') {
    let v = parseFloat(document.getElementById('fabric-length').value);
    if (!v || v <= 0) { alert('원단 길이를 입력해주세요'); return; }
    fabricLen = lengthUnit === 'yard' ? v * 91.44 : v;
  } else {
    targetQty = parseInt(document.getElementById('target-qty').value);
    if (!targetQty || targetQty <= 0) { alert('목표 수량을 입력해주세요'); return; }
  }

  const pieces = currentProduct.pieces;

  if (calcMode === 'A') {
    // 각 피스별 최대 세트 수 → 병목(가장 적은 수) 기준
    const perPiece = pieces.map(pc => calcModeA(pc, fabricW, fabricLen, guideLines, marginCm));
    const finalSets = Math.min(...perPiece.map(r => r.maxSets));
    // finalSets 기준으로 각 피스 재계산
    const results = pieces.map((pc, i) => ({
      piece: pc,
      plan: calcPlan(pc, fabricW, finalSets, guideLines, marginCm)
    }));
    renderResultA(finalSets, results, fabricW, fabricLen);
  } else {
    // 각 피스별 필요 길이 계산 → 합산
    const results = pieces.map(pc => ({
      piece: pc,
      plan: calcPlan(pc, fabricW, targetQty, guideLines, marginCm)
    }));
    const totalLen = results.reduce((s, r) => s + (r.plan ? r.plan.totalLen : 0), 0);
    renderResultB(targetQty, results, fabricW, totalLen);
  }
  showScreen('screen-result');
}

// ==================== Render A ====================
function renderResultA(maxSets, results, fabricW, fabricLen) {
  document.getElementById('result-subtitle').textContent = currentProduct.name;
  const bottleneck = results.reduce((m, r) => (r.plan && r.plan.totalLen > (m.plan ? m.plan.totalLen : 0)) ? r : m, results[0]);
  const usedLen = bottleneck.plan ? bottleneck.plan.totalLen : 0;
  const remain = Math.max(0, fabricLen - usedLen);

  let html = `<div class="result-hero">
    <div class="result-num">${maxSets}</div>
    <div class="result-unit-text">세트 생산 가능</div>
    <div class="result-label">원단 ${fabricW}cm × ${Math.round(fabricLen)}cm · 가이드 ${guideLines}줄</div>
  </div>`;

  html += `<div class="stat-row">
    <div class="stat-box"><div class="stat-val">${Math.round(usedLen)}cm</div><div class="stat-label">사용 길이</div></div>
    <div class="stat-box"><div class="stat-val">${Math.round(remain)}cm</div><div class="stat-label">남은 길이</div></div>
  </div>`;

  if (results.length > 1) {
    html += `<div class="highlight-box yellow">
      <div class="highlight-box-title">⚠️ 병목 피스</div>
      <div class="highlight-box-val">${esc(bottleneck.piece.name)}이 가장 많은 원단을 사용해요. 이 피스 기준으로 수량이 결정됩니다.</div>
    </div>`;
  }

  results.forEach((r, idx) => { html += renderPlanCard(r.piece, r.plan, idx); });
  document.getElementById('result-content').innerHTML = html;
}

// ==================== Render B ====================
function renderResultB(targetQty, results, fabricW, totalLen) {
  document.getElementById('result-subtitle').textContent = currentProduct.name;
  const yards = (totalLen / 91.44).toFixed(2);

  let html = `<div class="result-hero">
    <div class="result-num">${Math.round(totalLen)}</div>
    <div class="result-unit-text">cm 필요</div>
    <div class="result-label">${targetQty}세트 기준 · 약 ${yards}야드 · 가이드 ${guideLines}줄</div>
  </div>`;

  html += `<div class="stat-row">
    <div class="stat-box"><div class="stat-val">${targetQty}</div><div class="stat-label">목표 세트</div></div>
    <div class="stat-box"><div class="stat-val">${(totalLen/91.44).toFixed(1)}야드</div><div class="stat-label">필요 야드</div></div>
  </div>`;

  results.forEach((r, idx) => { html += renderPlanCard(r.piece, r.plan, idx); });
  document.getElementById('result-content').innerHTML = html;
}

// ==================== Plan Card ====================
function renderPlanCard(piece, plan, idx) {
  if (!plan) return `<div class="plan-card"><div class="plan-body" style="color:var(--danger)">⚠ ${esc(piece.name)}: 원단 폭이 너무 좁아요</div></div>`;
  const c = COLORS[idx % COLORS.length];

  let html = `<div class="plan-card">
    <div class="plan-header">
      <div class="plan-dot" style="background:${c}"></div>
      <div class="plan-name">${esc(piece.name)} ${plan.pieceW}×${plan.pieceH}cm</div>
      <div class="plan-tag ${plan.remRows > 0 ? 'plan-tag-warn' : 'plan-tag-ok'}">${plan.remRows > 0 ? '자투리 있음' : '딱 맞음'}</div>
    </div>
    <div class="plan-body">
      폭에 <strong>${plan.perRow}개</strong> 배치 · 총 <strong>${plan.totalRows}줄</strong> 필요<br>
      연단 <strong>${Math.round(plan.sheetLen)}cm</strong> × <strong>${plan.fullSheets}장</strong>`;

  if (plan.remRows > 0) {
    html += ` + 자투리 <strong>${Math.round(plan.remSheetLen)}cm</strong> × <strong>1장</strong>`;
  }
  html += `<br>총 길이: <strong>${Math.round(plan.totalLen)}cm</strong>`;
  html += `</div>`;

  // Sheet visualization
  html += `<div class="sheet-wrap">`;
  for (let s = 0; s < Math.min(plan.fullSheets, 2); s++) {
    html += renderSheetViz(plan, c, false, `${s + 1}번째 연단`);
  }
  if (plan.fullSheets > 2) {
    html += `<div style="text-align:center;padding:8px;color:var(--text3);font-size:12px;font-weight:700;">··· ${plan.fullSheets - 2}장 동일 반복</div>`;
  }
  if (plan.remRows > 0) {
    html += renderSheetViz(plan, c, true, '자투리 연단');
  }
  html += `</div></div>`;
  return html;
}

function renderSheetViz(plan, color, isRem, label) {
  const rows = isRem ? plan.remRows : guideLines;
  const height = isRem ? plan.remSheetLen : plan.sheetLen;
  const margin = marginCm;
  const pieceH = plan.pieceH;
  const perRow = plan.perRow;
  const dispH = Math.min(180, Math.max(70, rows * 30 + margin * 8));

  let html = `<div style="margin-bottom:10px">
    <div class="sheet-label">${label} — ${Math.round(height)}cm</div>
    <div class="sheet-canvas" style="height:${dispH}px;">`;

  if (margin > 0) {
    const mh = (margin / height) * 100;
    html += `<div class="sheet-margin-stripe" style="top:0;height:${mh}%"></div>`;
  }

  for (let r = 0; r < rows; r++) {
    const topPct = ((margin + r * pieceH) / height) * 100;
    const hPct = (pieceH / height) * 100;
    html += `<div class="sheet-piece-row" style="top:${topPct}%;height:${hPct}%;position:absolute;left:0;right:0;">`;
    for (let c2 = 0; c2 < perRow; c2++) {
      html += `<div class="sheet-piece-cell" style="background:${color};">${plan.pieceW}</div>`;
    }
    html += `</div>`;
  }

  if (margin > 0) {
    const mh = (margin / height) * 100;
    html += `<div class="sheet-margin-stripe" style="bottom:0;height:${mh}%"></div>`;
  }

  html += `</div></div>`;
  return html;
}

loadLocalCache();
renderProductList();
syncNow();
